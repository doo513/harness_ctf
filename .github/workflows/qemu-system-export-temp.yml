name: qemu-system-export-temporary
on:
  push:
    branches: [implementation/evidence-roadmap]
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Install and bundle qemu-system-aarch64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm
          mkdir -p bundle/bin bundle/lib bundle/share
          cp "$(command -v qemu-system-aarch64)" bundle/bin/
          ldd "$(command -v qemu-system-aarch64)" | awk '/=> \/|^\// {for(i=1;i<=NF;i++) if($i ~ /^\//) print $i}' | sort -u > deps.txt
          while read -r f; do cp -L "$f" bundle/lib/; done < deps.txt
          cp -a /usr/share/qemu bundle/share/qemu
          qemu-system-aarch64 --version > bundle/version.txt
          sha256sum bundle/bin/qemu-system-aarch64 > bundle/sha256.txt
          tar -C bundle -czf qemu-system-aarch64-bundle.tgz .
          ls -lh qemu-system-aarch64-bundle.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-system-aarch64-temporary
          path: qemu-system-aarch64-bundle.tgz
          if-no-files-found: error
