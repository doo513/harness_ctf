name: qemu-export-temporary

on:
  push:
    branches:
      - implementation/evidence-roadmap

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Install qemu-user-static
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
          qemu-aarch64-static --version
          cp "$(command -v qemu-aarch64-static)" ./qemu-aarch64-static
          sha256sum ./qemu-aarch64-static
      - name: Upload qemu-aarch64-static
        uses: actions/upload-artifact@v4
        with:
          name: qemu-aarch64-static-temporary
          path: qemu-aarch64-static
          if-no-files-found: error
