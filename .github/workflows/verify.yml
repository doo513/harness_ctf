name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: doo513/base_harness
          ref: 75834ac1ecb6c022771c2efee1f19495f356ee76
          path: third_party/base_harness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned base revision
        run: |
          test "$(git -C third_party/base_harness rev-parse HEAD)" = "$(python -c 'import json; print(json.load(open("base_harness.lock.json"))["commit"])')"
      - name: Install
        run: |
          python -m pip install -r third_party/base_harness/requirements-ci.lock
          python -m pip install -e third_party/base_harness --no-deps
          python -m pip install -e .
          python -m pip check
      - name: Install Pwn engineering probe tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb
          echo "gdb_path=$(command -v gdb)"
          dpkg-query -W -f='gdb_version=${Version}\n' gdb
          gdb --version | head -n 1
      - name: Compile
        run: python -m compileall -q src tests scripts third_party/base_harness/src third_party/base_harness/tests third_party/base_harness/scripts
      - name: Base regression
        working-directory: third_party/base_harness
        run: pytest -q
      - name: Base invariant probes
        working-directory: third_party/base_harness
        run: |
          python scripts/core_freeze_audit_probe.py
          python scripts/stage2_tool_backend_binding_probe.py
          sudo -E "$(command -v python)" scripts/stage2_session_namespace_probe.py
          python scripts/stage4_semantic_probe.py
          python scripts/stage5_recovery_effectiveness_benchmark.py
          python scripts/stage6_task_world_progress_probe.py
          python scripts/stage7_context_probe.py
          python scripts/stage8_retrieval_probe.py
      - name: CTF regression diagnostic
        id: ctf_regression
        shell: bash
        run: |
          set +e
          pytest -q --tb=short > ctf-pytest.log 2>&1
          status=$?
          cat ctf-pytest.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve CTF regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctf-pytest-log
          path: ctf-pytest.log
          if-no-files-found: error
      - name: Enforce CTF regression
        if: steps.ctf_regression.outputs.status != '0'
        run: |
          echo "CTF regression failed; see ctf-pytest-log artifact"
          exit 1
      - name: Live Pwn crash semantic probe
        run: sudo -E "$(command -v python)" scripts/pwn_crash_semantic_probe.py
      - name: Live Pwn x86_64 control-flow semantic probe
        run: sudo -E "$(command -v python)" scripts/pwn_control_semantic_probe.py
      - name: Live Pwn local-proof semantic probe
        run: sudo -E "$(command -v python)" scripts/pwn_local_proof_semantic_probe.py
      - name: Controlled Pwn target-environment compatibility probe
        run: python scripts/pwn_environment_compatibility_probe.py
      - name: Controlled Pwn remote-behavior TCP probe
        run: python scripts/pwn_remote_behavior_probe.py
      - name: Core-integrated Pwn external flag completion probe
        run: python scripts/pwn_flag_completion_probe.py
      - name: Controlled Pwn hypothesis runtime-dedupe probe
        run: python scripts/pwn_hypothesis_dedupe_probe.py
      - name: Controlled Pwn CTF recovery-progress integration probe
        run: python scripts/pwn_recovery_progress_probe.py
      - name: Controlled benchmark arm runtime probe
        run: python scripts/evaluation_arm_runtime_probe.py
      - name: Controlled benchmark integrity probe
        run: python scripts/evaluation_integrity_probe.py
      - name: Controlled corpus ingestion integrity probe
        run: python scripts/evaluation_ingest_probe.py
      - name: Controlled benchmark executor boundary probe
        run: python scripts/evaluation_executor_boundary_probe.py
      - name: Controlled runtime-backed benchmark executor probe
        run: python scripts/evaluation_runtime_executor_probe.py
      - name: Temporary Dreamhack 103 remote smoke probe
        env:
          CTF_SMOKE_HOST: host3.dreamhack.games
          CTF_SMOKE_PORT: '13825'
        run: |
          python - <<'PY'
          import json, os, socket, time

          host = os.environ['CTF_SMOKE_HOST']
          port = int(os.environ['CTF_SMOKE_PORT'])

          def recv_some(sock, timeout=1.0):
              sock.settimeout(timeout)
              chunks=[]
              end=time.monotonic()+timeout
              while time.monotonic()<end:
                  try:
                      b=sock.recv(4096)
                  except socket.timeout:
                      break
                  if not b:
                      break
                  chunks.append(b)
                  if b'Control code?' in b or b'Exception:' in b:
                      time.sleep(0.05)
              return b''.join(chunks)

          def transact(payload):
              s=socket.create_connection((host,port),timeout=5)
              banner=recv_some(s,1.0)
              s.sendall(payload)
              out=recv_some(s,2.0)
              try:
                  s.shutdown(socket.SHUT_WR)
              except OSError:
                  pass
              tail=recv_some(s,0.5)
              s.close()
              return banner+out+tail

          valid=transact(b'321\n1\n2\n')
          baseline_invalid=transact(b'1\n')
          overwrite_candidate=transact(b'768\n0\n0\n0\n0\n0\n0\n')
          result={
              'probe':'dreamhack-103-remote-smoke-v1',
              'valid_add_observed': b'=3.000000' in valid,
              'valid_prompt_reentered': valid.count(b'Control code?') >= 2,
              'invalid_exception_observed': b'Exception:' in baseline_invalid,
              'overwrite_candidate_exception_observed': b'Exception:' in overwrite_candidate,
              'valid_transcript': valid.decode('utf-8','replace'),
              'invalid_transcript': baseline_invalid.decode('utf-8','replace'),
              'overwrite_candidate_transcript': overwrite_candidate.decode('utf-8','replace'),
              'crash_claimed': False,
              'flag_claimed': False,
          }
          print(json.dumps(result, sort_keys=True))
          assert result['valid_add_observed'], 'remote service did not exhibit the expected 321/add behavior'
          PY
