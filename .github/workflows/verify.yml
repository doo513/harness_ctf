name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: doo513/base_harness
          ref: 20079ffd90cc063958f084da8286e05f38ccdef0
          path: third_party/base_harness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned base revision
        run: |
          test "$(git -C third_party/base_harness rev-parse HEAD)" = "$(python -c 'import json; print(json.load(open("base_harness.lock.json"))["commit"])')"
      - name: Install
        run: |
          python -m pip install -r third_party/base_harness/requirements-ci.lock
          python -m pip install -e third_party/base_harness --no-deps
          python -m pip install -e .
          python -m pip check
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Base regression
        run: pytest -q third_party/base_harness/tests
      - name: Base invariant probes
        run: |
          python third_party/base_harness/scripts/core_freeze_audit_probe.py
          python third_party/base_harness/scripts/stage2_tool_backend_binding_probe.py
          sudo -E "$(command -v python)" third_party/base_harness/scripts/stage2_session_namespace_probe.py
          python third_party/base_harness/scripts/stage4_semantic_probe.py
          python third_party/base_harness/scripts/stage5_recovery_effectiveness_benchmark.py
          python third_party/base_harness/scripts/stage6_task_world_progress_probe.py
          python third_party/base_harness/scripts/stage7_context_probe.py
          python third_party/base_harness/scripts/stage8_retrieval_probe.py
      - name: CTF regression
        run: pytest -q
      - name: Live Pwn crash semantic probe
        run: sudo -E "$(command -v python)" scripts/pwn_crash_semantic_probe.py
