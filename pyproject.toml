[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verified-ctf-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
base = ["verified-state-harness @ git+https://github.com/doo513/base_harness.git@20079ffd90cc063958f084da8286e05f38ccdef0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
