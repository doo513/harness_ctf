[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verified-ctf-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.0.0",
  "httpx2>=2.5.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
base = ["verified-state-harness @ git+https://github.com/doo513/base_harness.git@75834ac1ecb6c022771c2efee1f19495f356ee76"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
